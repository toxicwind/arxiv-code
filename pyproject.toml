[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arxiv-code"
version = "0.1.0"
description = "Emergent 2026 arXiv LaTeX/e-Print decompiler, algorithmic extraction engine, and code repository miner"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "ToxicWind", email = "toxicwind@gmail.com" }
]
keywords = [
  "arxiv",
  "machine-learning",
  "latex",
  "code-extraction",
  "llm",
  "deep-learning",
  "research-tool",
  "cli"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "rich>=13.0.0"
]

[project.scripts]
arxiv-code = "arxiv_code.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_code"]
